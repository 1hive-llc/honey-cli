name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node 22 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_FORK_E2E: '0'
      DOTENV_CONFIG_PATH: /dev/null
      GNOSIS_RPC_URL: http://127.0.0.1:1
      CHIADO_RPC_URL: http://127.0.0.1:1
      FORK_RPC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
